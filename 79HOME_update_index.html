<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แก้ไข index.html — 79 HOME ENGINEERING</title><style>body{font-family:system-ui,Tahoma,sans-serif;background:#f2f8ff;color:#092f55;max-width:680px;margin:50px auto;padding:20px}main{background:white;padding:28px;border-radius:20px;box-shadow:0 12px 35px #1233}label{display:block;font-weight:700;margin:20px 0 8px}input{width:100%;padding:14px;border:1px solid #9bc2de;border-radius:10px;box-sizing:border-box}button{border:0;background:#0879d4;color:white;padding:15px 24px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}#status{margin:18px 0;color:#27623a}small{color:#536d80}</style></head><body><main><h1>79 HOME ENGINEERING</h1><h2>อัปเดตหน้าเว็บไซต์</h2><p>เพิ่มข้อความเลือกสีรุ่นนั่งกอดหัวใจ และเบอร์โทร 096-2467999 โดยคงรูปสินค้า คู่มือ และส่วนอื่นไว้เหมือนเดิม</p><label for="file">1. เลือก index.html จาก GitHub ที่ดาวน์โหลดมา</label><input type="file" id="file" accept=".html,text/html"><p><button id="go">2. สร้างไฟล์ index.html ฉบับแก้ไข</button></p><p id="status" role="status"></p><small>ไฟล์ทำงานภายในเครื่องของคุณ ไม่ส่งข้อมูลไปยังเว็บไซต์อื่น</small></main><script>
const oldHeading='<div class="sectionheading"><h3>รุ่นพิเศษ · นั่งกอดหัวใจ</h3><span>แบบที่ 4 · 3 ภาพ</span></div><div class="grid">';
const newHeading='<div class="sectionheading"><h3>รุ่นพิเศษ · นั่งกอดหัวใจ</h3><span>แบบที่ 4 · 3 ภาพ</span></div><p class="lead" style="margin:8px 0 22px;font-size:17px">รุ่นพิเศษ นั่งกอดหัวใจ สามารถเลือกสีตัวกระต่ายและสีหัวใจได้ตามความต้องการของท่าน กรุณาติดต่อร้านเพื่อสอบถามรายละเอียดงานสั่งทำ</p><div class="grid">';
const oldContact='</div><p class="lead" style="font-size:12px">โปรดตรวจสอบลิงก์บัญชี LINE OA';
const newContact='</div><p class="lead" style="margin:18px 0;font-size:18px"><strong>โทรศัพท์: <a href="tel:0962467999" style="color:#0879d4;text-decoration:underline">096-2467999</a></strong></p><p class="lead" style="font-size:12px">โปรดตรวจสอบลิงก์บัญชี LINE OA';
document.getElementById('go').addEventListener('click',async()=>{const file=document.getElementById('file').files[0],status=document.getElementById('status');if(!file){status.textContent='กรุณาเลือกไฟล์ index.html ก่อน';return}let data=await file.text();const notes=[];if(data.includes(oldHeading)){data=data.replace(oldHeading,newHeading);notes.push('เพิ่มข้อความรุ่นพิเศษ')}else if(data.includes('รุ่นพิเศษ นั่งกอดหัวใจ สามารถเลือกสีตัวกระต่าย'))notes.push('มีข้อความรุ่นพิเศษแล้ว');else{status.textContent='ไม่พบตำแหน่งรุ่นพิเศษในไฟล์นี้ กรุณาใช้ index.html เวอร์ชันปัจจุบัน';return}if(data.includes(oldContact)){data=data.replace(oldContact,newContact);notes.push('เพิ่มเบอร์โทร')}else if(data.includes('tel:0962467999'))notes.push('มีเบอร์โทรแล้ว');else{status.textContent='ไม่พบตำแหน่งช่องทางการติดต่อ กรุณาใช้ index.html เวอร์ชันปัจจุบัน';return}const url=URL.createObjectURL(new Blob([data],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='สำเร็จ: '+notes.join(' และ ')+' — ดาวน์โหลด index.html ใหม่แล้ว'});
</script></body></html>
